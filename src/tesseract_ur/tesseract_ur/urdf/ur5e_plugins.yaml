kinematic_plugins:
  search_libraries:
    - tesseract_kinematics_opw_factories
  fwd_kin_plugins:
    ur_manipulator:
      default: KDLFwdKinChain
      plugins:
# //! [KDL FK config]
        KDLFwdKinChain:
          class: KDLFwdKinChainFactory
          config:
            base_link: base_link
            tip_link: tool0
# //! [KDL FK config]
  inv_kin_plugins:
    ur_manipulator:
      default: URInvKin
      plugins:
        URInvKin:
          class: URInvKinFactory
          config:
            base_link: base_link
            tip_link: tool0
            model: UR5e #Current Options: UR3, UR5, UR10, UR3e, UR5e, UR10e
# //! [URInvKin config]
